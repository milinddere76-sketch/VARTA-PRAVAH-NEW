version: "3.9"

services:
  # --- CORE NEWS ENGINE ---
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: always
    command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./queue:/app/queue
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./queue:/app/queue
    depends_on:
      - app
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  # --- STREAMING NODE (HETZNER) ---
  streamer:
    build:
      context: .
      dockerfile: Dockerfile.streamer
    restart: always
    env_file: .env
    ports:
      - "${STREAMER_RTMP_PORT:-1935}:1935"
      - "${STREAMER_HTTP_PORT:-8085}:8080"
    volumes:
      - ./output:/home/ubuntu/videos
      - ./queue:/home/ubuntu/queue
      - ./logs:/home/ubuntu/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - worker

  # --- MINIMAL INFRASTRUCTURE ---
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: vartapravah
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

volumes:
  postgres_data:

networks:
  default:
    name: vp_network
